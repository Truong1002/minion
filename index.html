<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hết Giận Nhé? - Tranh Chì Vẽ Tay</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Canvas hạt lung linh nền -->
    <canvas id="particle-canvas"></canvas>

    <!-- Canvas pháo hoa ăn mừng -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Canvas vẽ Minion 2D Toàn Màn Hình -->
    <canvas id="mainArtCanvas"></canvas>

    <!-- 1. Màn hình bắt đầu -->
    <div class="main-wrapper" id="mainWrapper">
        <button class="btn-start" id="btnStart" type="button">
            <span class="btn-start-icon">✏️</span> Bắt đầu
        </button>
    </div>

    <!-- Badge Tiến Trình Vẽ Bút Chì Trên Cùng -->
    <div class="draw-status-badge hidden" id="drawStatusBadge">
        <div class="badge-content">
            <span class="pencil-indicator">✏️</span>
            <span class="status-title" id="statusTitle">Đang phác chì bức tranh...</span>
            <span class="status-percent" id="statusPercent">0%</span>
        </div>
        <div class="progress-bar-mini">
            <div class="progress-fill-mini" id="progressFillMini"></div>
        </div>
    </div>

    <!-- Bút chì di chuyển phác họa trên màn hình -->
    <div class="pencil-tool hidden" id="pencilTool">
        <span class="pencil-icon">✏️</span>
        <span class="pencil-lead-glow"></span>
    </div>

    <!-- Nút Reset góc trên bên phải -->
    <button class="floating-reset-btn hidden" id="btnFloatingReset">
        🔄 Thử lại
    </button>

    <script src="sketch-photo.js"></script>
    <script src="script.js"></script>
</body>

</html>
